<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MantechPro Master V4</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#020521" />

            src="/splash-welcome.png"
            alt="MantechPro"
            style="max-width: 100%; max-height: 78vh; width: auto; height: auto; object-fit: contain; object-position: center; filter: drop-shadow(0 20px 50px rgba(0,0,0,0.7)); border-radius: 28px;"
          />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
