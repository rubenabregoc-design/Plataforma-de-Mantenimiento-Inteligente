# Mantech Pro App Hosting Configuration
runtime: nodejs20

runConfig:
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: BREVO_API_KEY
    availability: [RUNTIME, BUILD]
  - variable: SENDER_EMAIL
    availability: [RUNTIME, BUILD]

# Explicit build command for Vite 6 + React 19
# This ensures that App Hosting runs the same build process as local
# buildConfig:
#   buildCommand: npm run build
